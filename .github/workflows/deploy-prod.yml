name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      allow_migrations:
        description: 'Allow deployment when database/migrations changed (requires prior DB review)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: supreme-deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, supreme-prod]
    environment: production
    timeout-minutes: 60

    steps:
      - name: Verify main branch ref
        shell: powershell
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/main') {
            throw "Production deploy is restricted to refs/heads/main (got '$env:GITHUB_REF')."
          }

      - name: Check out main branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true
          clean: false

      - name: Configure server PHP, Composer, and Node runtimes
        shell: powershell
        run: |
          $phpDir = 'C:\laragon\bin\php\php-8.4.27-nts-Win32-vs17-x64'
          $composerDir = 'C:\ProgramData\ComposerSetup\bin'
          $nodeDir = 'C:\ProgramData\SUPREME-Deploy\runtime\node-v22.23.0'
          foreach ($dir in @($phpDir, $composerDir, $nodeDir)) {
            if (-not (Test-Path -LiteralPath $dir)) {
              throw "Required server runtime directory missing: $dir"
            }
            Add-Content -LiteralPath $env:GITHUB_PATH -Value $dir
          }
          $env:Path = "$phpDir;$composerDir;$nodeDir;$env:Path"
          $phpVersion = & "$phpDir\php.exe" -r 'echo PHP_VERSION;'
          if ($LASTEXITCODE -ne 0 -or $phpVersion -cne '8.4.27') {
            throw "Expected PHP 8.4.27, got '$phpVersion'."
          }
          $nodeVersion = & "$nodeDir\node.exe" --version
          if ($LASTEXITCODE -ne 0 -or $nodeVersion -notmatch '^v22\.') {
            throw "Expected Node v22.x, got '$nodeVersion'."
          }

      - name: Run lint, frontend tests, and asset build
        shell: powershell
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $composerLockHash = (Get-FileHash -LiteralPath 'composer.lock' -Algorithm SHA256).Hash
          $composerStamp = 'vendor\.composer-lock.sha256'
          $pintBin = 'vendor\laravel\pint\builds\pint'
          if (-not (Test-Path -LiteralPath $pintBin) -or -not (Test-Path -LiteralPath $composerStamp) -or ((Get-Content -LiteralPath $composerStamp -Raw).Trim() -ne $composerLockHash)) {
            php C:\ProgramData\ComposerSetup\bin\composer.phar install --no-interaction --prefer-dist --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Composer install failed.' }
            Set-Content -LiteralPath $composerStamp -Value $composerLockHash -NoNewline
          } else {
            Write-Host "Runner vendor/ already matches composer.lock ($composerLockHash); skipping composer install."
          }
          php vendor/laravel/pint/builds/pint --test
          if ($LASTEXITCODE -ne 0) { throw 'Pint code style check failed.' }

          $npmLockHash = (Get-FileHash -LiteralPath 'package-lock.json' -Algorithm SHA256).Hash
          $npmStamp = 'node_modules\.package-lock.sha256'
          $viteBin = 'node_modules\.bin\vite.cmd'
          if (-not (Test-Path -LiteralPath $viteBin) -or -not (Test-Path -LiteralPath $npmStamp) -or ((Get-Content -LiteralPath $npmStamp -Raw).Trim() -ne $npmLockHash)) {
            npm install --prefer-offline --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed.' }
            Set-Content -LiteralPath $npmStamp -Value $npmLockHash -NoNewline
          } else {
            Write-Host "Runner node_modules/ already matches package-lock.json ($npmLockHash); skipping npm install."
          }
          npm run test:frontend
          if ($LASTEXITCODE -ne 0) { throw 'Frontend regression tests failed.' }
          if (Test-Path -LiteralPath 'public\build') {
            Remove-Item -LiteralPath 'public\build' -Recurse -Force
          }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Vite production build failed.' }

      - name: Deploy with -BackupFirst and run smoke test
        shell: powershell
        env:
          ALLOW_MIGRATIONS: ${{ inputs.allow_migrations }}
        run: |
          $ErrorActionPreference = 'Stop'
          $deployArgs = @{
            BackupFirst    = $true
            RepositoryPath = $PWD.Path
            Commit         = '${{ github.sha }}'
            SmokeTestUrl   = 'https://supremecbed.pcc.gov.ph/login'
          }
          if ($env:ALLOW_MIGRATIONS -eq 'true') {
            $deployArgs['AllowMigrations'] = $true
          }
          & .\scripts\deploy\deploy.ps1 @deployArgs
          if ($LASTEXITCODE -ne 0) {
            throw 'Production deployment script failed.'
          }

      - name: Tag deployed commit (prod-YYYY-MM-DD-HHMM)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $manila = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTimeOffset]::UtcNow, 'Singapore Standard Time')
          $tagName = 'prod-' + $manila.ToString('yyyy-MM-dd-HHmm')
          $existing = & git tag -l $tagName
          if ($existing) {
            $tagName = 'prod-' + $manila.ToString('yyyy-MM-dd-HHmmss')
          }
          & git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' `
            tag -a $tagName '${{ github.sha }}' -m "Deployed commit ${{ github.sha }} to SUPREME production by ${{ github.actor }}"
          if ($LASTEXITCODE -ne 0) { throw "Failed to create tag $tagName." }
          & git push origin "refs/tags/$tagName"
          if ($LASTEXITCODE -ne 0) { throw "Failed to push tag $tagName." }
          Write-Host "Tagged and pushed production release: $tagName"
