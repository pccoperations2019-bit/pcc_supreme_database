name: Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # This database exists only inside the CI runner. Never use production credentials.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=ci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_URL: http://localhost
      APP_DEBUG: 'false'
      APP_MAINTENANCE_DRIVER: file
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      BCRYPT_ROUNDS: '4'

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_mysql, xml, zip
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: Generate a temporary application key
        shell: bash
        run: |
          key="base64:$(openssl rand -base64 32)"
          echo "::add-mask::$key"
          echo "APP_KEY=$key" >> "$GITHUB_ENV"

      - name: Create an empty environment file for the test application
        run: touch .env

      - name: Install PHP dependencies from lockfile
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify PHP platform requirements
        run: composer check-platform-reqs

      - name: Install frontend dependencies from lockfile
        run: npm ci

      - name: Build production frontend assets
        run: npm run build

      - name: Test frontend form behavior
        run: npm run test:frontend

      - name: Run application tests against the disposable database
        run: composer test

      - name: Save the tested frontend build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-${{ github.sha }}
          path: public/build/
          if-no-files-found: error
          retention-days: 7

      - name: Test release packaging and staging
        shell: pwsh
        run: ./tests/Deployment/release.test.ps1

      - name: Package application source and tested frontend assets
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          ./scripts/deployment/New-Release.ps1 -RepositoryPath $PWD.Path `
            -OutputDirectory "$env:RUNNER_TEMP/supreme-release" -Commit $env:RELEASE_COMMIT

      - name: Save release candidate for isolated staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/supreme-release/*
          if-no-files-found: error
          retention-days: 14
