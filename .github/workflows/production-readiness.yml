name: Production Readiness

# Connection test only. No push trigger and no application activation command.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supreme-production-readiness
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Require the approved private-network integration
        env:
          NETWORK_READY: ${{ vars.PROD_PRIVATE_NETWORK_READY }}
        run: |
          if [[ "$NETWORK_READY" != "true" ]]; then
            echo 'Private-network integration is not configured. Coordinate the approved route with IT first.'
            exit 1
          fi

      # Insert the reviewed, provider-specific private-network connection step
      # here BEFORE setting PROD_PRIVATE_NETWORK_READY=true. The variable alone
      # does not create a route. Do not expose SSH publicly to make this pass.

      - name: Verify server identity and inspect deployment readiness
        env:
          SSH_HOST: ${{ vars.PROD_SSH_HOST }}
          SSH_PORT: ${{ vars.PROD_SSH_PORT }}
          SSH_USER: ${{ vars.PROD_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo 'Invalid SSH host'; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo 'Invalid SSH port'; exit 1; }
          [[ "$SSH_USER" == 'supreme_deploy' ]] || { echo 'Unexpected deployment account'; exit 1; }
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || { echo 'SSH secrets are missing'; exit 1; }
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/supreme-ssh.XXXXXXXX")"
          trap 'rm -f -- "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir -- "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset SSH_PRIVATE_KEY SSH_KNOWN_HOSTS
          ssh -F /dev/null -i "$ssh_dir/key" -p "$SSH_PORT" \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            "$SSH_USER@$SSH_HOST" \
            'powershell.exe -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File C:/ProgramData/SUPREME-Deploy/controller/Get-DeploymentReadiness.ps1'
