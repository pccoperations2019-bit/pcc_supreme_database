[PHP]
post_max_size = 100M
upload_max_filesize = 100M
variables_order = EGPCS
memory_limit = 4G
max_execution_time = 300
max_input_time = 300

[Date]
date.timezone = Asia/Manila

[opcache]
opcache.enable = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
opcache.max_accelerated_files = 10000
opcache.memory_consumption = 256
opcache.max_wasted_percentage = 10
opcache.interned_strings_buffer = 16
opcache.fast_shutdown = 1

; SUPREME CBED System - PCC Business Intelligence Configuration
; Optimized for data warehousing operations and PDF report generation
opcache.preload_user = sail

; Session configuration for multi-tenancy support
session.cookie_lifetime = 86400
session.gc_maxlifetime = 86400

; File upload limits for CBED program documentation
max_file_uploads = 50

; Error reporting for CBED development environment
log_errors = On
error_log = /var/log/php_errors.log