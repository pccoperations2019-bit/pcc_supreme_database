name: Rector Code Quality
on: [pull_request]
jobs:
  rector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
      - name: Install dependencies
        run: composer install
      - name: Run Rector
        run: vendor/bin/rector process --dry-run --no-progress-bar
