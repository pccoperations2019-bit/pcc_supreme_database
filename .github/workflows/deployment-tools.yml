name: Deployment Tools

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-release-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test release packaging and staging on PowerShell 7
        shell: pwsh
        run: ./tests/Deployment/release.test.ps1
      - name: Test Windows PowerShell 5.1 compatibility
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/Deployment/release.test.ps1
