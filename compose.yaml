services:
    laravel.test:
        build:
            context: ./docker/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
            - 'minio.local.test:host-gateway'
            - 'minio-console.local.test:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
            - mailpit
            - minio
            - redis
    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    minio:
        image: 'minio/minio:latest'
        ports:
            - '${FORWARD_MINIO_PORT:-9000}:9000'
            - '${FORWARD_MINIO_CONSOLE_PORT:-8900}:8900'
        environment:
            MINIO_ROOT_USER: '${AWS_ACCESS_KEY_ID}'
            MINIO_ROOT_PASSWORD: '${AWS_SECRET_ACCESS_KEY}'
            MINIO_API_CORS_ALLOW_ORIGIN: 'http://localhost:8080,http://minio.local.test,http://minio.local.test:8900,http://localhost:9000,http://localhost:8900'
            MINIO_API_CORS_ALLOW_METHODS: 'GET,PUT,POST,DELETE,HEAD,OPTIONS'
            MINIO_API_CORS_ALLOW_HEADERS: 'Authorization,Content-Type,Origin,Accept,Range,x-amz-date,x-amz-content-sha256,x-amz-security-token,x-amz-security-token'
            MINIO_API_CORS_EXPOSE_HEADERS: 'ETag'
        volumes:
            - 'sail-minio:/data'
            - './scripts/minio-init.sh:/scripts/minio-init.sh'
        networks:
            - sail
        command: 'minio server /data --console-address ":8900"'
        healthcheck:
            test:
                - CMD
                - mc
                - ready
                - local
            retries: 3
            timeout: 5s
        labels:
            - traefik.enable=true
            - traefik.http.services.minio-api-backend.loadbalancer.server.port=9000
            - traefik.http.routers.minio-api.service=minio-api-backend
            - traefik.http.routers.minio-api.rule=Host(`minio.local.test`)
            - traefik.http.routers.minio-api.entrypoints=web
            - traefik.http.services.minio-console-backend.loadbalancer.server.port=8900
            - traefik.http.routers.minio-console.service=minio-console-backend
            - traefik.http.routers.minio-console.rule=Host(`minio-console.local.test`)
            - traefik.http.routers.minio-console.entrypoints=web
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    traefik:
        image: 'traefik:v2.11'
        command:
            - '--providers.docker=true'
            - '--providers.docker.exposedbydefault=false'
            - '--entrypoints.web.address=:80'
            - '--api.dashboard=true'
            - '--api.insecure=true'
            - '--log.level=DEBUG'
        ports:
            - '8090:80'  # Changed from 80:80 to avoid conflict
            - '8091:8080' # Traefik dashboard
        networks:
            - sail
        volumes:
            - '/var/run/docker.sock:/var/run/docker.sock:ro'
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-minio:
        driver: local
    sail-redis:
        driver: local
